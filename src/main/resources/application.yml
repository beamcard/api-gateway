server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/auth/**,/.well-known/jwks.json
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/profiles/**,/me/profile/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8070/.well-known/jwks.json}

beamcard:
  cors:
    allowed-origins: http://localhost:5173
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    limit: ${RATE_LIMIT_MAX:20} # requests per window per IP
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    trusted-hops: ${RATE_LIMIT_TRUSTED_HOPS:1}
    max-tracked-ips: 10000
    paths:
      - /auth/login
      - /auth/signup
      - /auth/password/forgot
      - /auth/oauth/google
      - /auth/email/verify/resend

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
